<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Prompt Optimization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--vscode-foreground);
            font-weight: 600;
        }

        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            background-color: var(--vscode-editor-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .column-header {
            background-color: var(--vscode-editor-background);
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--vscode-panel-border);
            color: var(--vscode-foreground);
        }

        .column-content {
            padding: 16px;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        /* Diff highlighting */
        .diff-removed {
            background-color: rgba(255, 0, 0, 0.2);
            color: var(--vscode-errorForeground);
            text-decoration: line-through;
            padding: 2px 4px;
            border-radius: 2px;
        }

        .diff-added {
            background-color: rgba(0, 255, 0, 0.2);
            color: var(--vscode-terminal-ansiGreen);
            padding: 2px 4px;
            border-radius: 2px;
        }

        .diff-unchanged {
            color: var(--vscode-foreground);
        }

        /* Changes section */
        .changes-section {
            margin-bottom: 30px;
        }

        .changes-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--vscode-foreground);
            font-weight: 600;
        }

        .changes-list {
            background-color: var(--vscode-editor-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            padding: 16px;
        }

        .changes-list ul {
            list-style: none;
            padding-left: 0;
        }

        .changes-list li {
            padding: 8px 0;
            padding-left: 24px;
            position: relative;
            color: var(--vscode-foreground);
        }

        .changes-list li:before {
            content: "•";
            position: absolute;
            left: 8px;
            color: var(--vscode-terminal-ansiCyan);
            font-weight: bold;
        }

        .changes-list li:not(:last-child) {
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        /* Buttons */
        .button-container {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: var(--vscode-font-family);
            transition: background-color 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        .btn-primary:hover {
            background-color: var(--vscode-button-hoverBackground);
        }

        .btn-secondary {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        .btn-secondary:hover {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--vscode-foreground);
            border: 1px solid var(--vscode-panel-border);
        }

        .btn-cancel:hover {
            background-color: var(--vscode-list-hoverBackground);
        }

        /* Scrollbar styling */
        .column-content::-webkit-scrollbar {
            width: 10px;
        }

        .column-content::-webkit-scrollbar-track {
            background: var(--vscode-scrollbarSlider-background);
        }

        .column-content::-webkit-scrollbar-thumb {
            background: var(--vscode-scrollbarSlider-hoverBackground);
            border-radius: 5px;
        }

        .column-content::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-scrollbarSlider-activeBackground);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--vscode-descriptionForeground);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prompt Optimization Results</h1>

        <div class="comparison-container">
            <div class="column">
                <div class="column-header">Original Prompt</div>
                <div class="column-content" id="originalPrompt">
                    <div class="empty-state">No original prompt provided</div>
                </div>
            </div>

            <div class="column">
                <div class="column-header">Optimized Prompt</div>
                <div class="column-content" id="optimizedPrompt">
                    <div class="empty-state">No optimized prompt available</div>
                </div>
            </div>
        </div>

        <div class="changes-section">
            <h2>Changes Applied</h2>
            <div class="changes-list">
                <ul id="changesList">
                    <li>No changes to display</li>
                </ul>
            </div>
        </div>

        <div class="button-container">
            <button class="btn-cancel" id="cancelBtn">Cancel</button>
            <button class="btn-secondary" id="sendOriginalBtn">Send Original</button>
            <button class="btn-primary" id="useOptimizedBtn">Use Optimized</button>
        </div>
    </div>

    <script>
        // Get VS Code API
        const vscode = acquireVsCodeApi();

        // Button event listeners
        document.getElementById('useOptimizedBtn').addEventListener('click', () => {
            vscode.postMessage({
                command: 'useOptimized',
                text: document.getElementById('optimizedPrompt').textContent
            });
        });

        document.getElementById('sendOriginalBtn').addEventListener('click', () => {
            vscode.postMessage({
                command: 'sendOriginal',
                text: document.getElementById('originalPrompt').textContent
            });
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            vscode.postMessage({
                command: 'cancel'
            });
        });

        // Listen for messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;

            switch (message.command) {
                case 'updateContent':
                    updateContent(message.original, message.optimized, message.changes);
                    break;
            }
        });

        function updateContent(original, optimized, changes) {
            // Update original prompt
            const originalEl = document.getElementById('originalPrompt');
            originalEl.innerHTML = '';
            originalEl.textContent = original;

            // Update optimized prompt
            const optimizedEl = document.getElementById('optimizedPrompt');
            optimizedEl.innerHTML = '';
            optimizedEl.textContent = optimized;

            // Update changes list
            const changesListEl = document.getElementById('changesList');
            changesListEl.innerHTML = '';

            if (changes && changes.length > 0) {
                changes.forEach(change => {
                    const li = document.createElement('li');
                    li.textContent = change;
                    changesListEl.appendChild(li);
                });
            } else {
                const li = document.createElement('li');
                li.textContent = 'No significant changes detected';
                changesListEl.appendChild(li);
            }
        }

        // Optional: Apply diff highlighting (can be enhanced with a proper diff algorithm)
        function applyDiffHighlighting(original, optimized) {
            // This is a simple implementation. For production, consider using a diff library
            // or implementing a more sophisticated diff algorithm
            const originalWords = original.split(' ');
            const optimizedWords = optimized.split(' ');

            // Simple word-by-word comparison (placeholder for more sophisticated diff)
            return {
                original: original,
                optimized: optimized
            };
        }
    </script>
</body>
</html>
